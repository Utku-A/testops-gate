[project]
name = "testops-gate"
version = "0.2.1"
description = "TestOps Gate: OpenVPN private network with a terminal dashboard, internal DNS, per-user logs and security monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Halis Utku Aladağ" }]
keywords = ["openvpn", "vpn", "devops", "tui", "unbound", "nftables"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = [
    "textual>=3.0",
    "PyYAML>=5.4",
]

[project.urls]
Homepage = "https://testopscenter.com"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
testops-gate = "testops_gate.cli:main"
testops-gated = "testops_gate.daemon.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testops_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
